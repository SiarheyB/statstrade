# Прод-стек для самохостинга (мини-сервер J1900): БД + приложение + collector +
# авто-обновление образов. Образы собираются в CI и тянутся из GHCR.
#
# Запуск:   docker compose -f docker-compose.prod.yml up -d
# Логи:     docker compose -f docker-compose.prod.yml logs -f app
# Образы лежат в GHCR (lowercase owner): ghcr.io/siarheyb/statstrade-{app,collector}
#
networks:
  tradestats:
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    container_name: tradestats-db
    restart: unless-stopped
    # Лимиты памяти: без потолка один процесс может утащить всю RAM в своп и
    # подвесить машину (как случилось при тяжёлом orderflow). mem_limit = жёсткий
    # потолок: при превышении ядро убивает процесс в контейнере, и docker его
    # перезапускает (restart: unless-stopped) — вместо фриза всей машины. У БД
    # потолок щедрый: ей нужна память под агрегации (rollup-бэкафилл) и кэш; при
    # упоре ядро прибьёт лишь backend-соединение (запрос упадёт, приложение
    # переподключится), а не весь Postgres.
    #
    # 2026-08-22: сервер больше не делится со вторым прод-стеком — все 8 ГБ и
    # 4 ядра наши. Потолок БД при этом НЕ подняли: освободившееся отдано app
    # (там был реальный OOM), а Postgres выигрывает не от потолка, а от тюнинга
    # внутри него — shared_buffers удвоен, параллелизм поднят. Worst case
    # укладывается: 1 ГБ shared_buffers + 20 соединений × 20 МБ work_mem × ~2
    # узла плана ≈ 2.4 ГБ < 2560.
    mem_limit: 2560m
    mem_reservation: 1g
    # /dev/shm должен вмещать shared_buffers (1 ГБ) плюс прочие структуры общей
    # памяти. По умолчанию Docker даёт 64M — мало.
    shm_size: '1536m'
    # Параллелизм: 4 ядра теперь целиком наши, поэтому запросу разрешено два
    # воркера вместо одного (агрегации карты ордеров — самое тяжёлое, что тут
    # есть). Полностью снимать ограничение всё равно нельзя: без него одна
    # агрегация поднимала воркеров до ~550% CPU и подтормаживала коллектор с
    # приложением.
    #
    # Тюнинг памяти под mem_limit=2560m (дефолты alpine консервативны — 128MB
    # shared_buffers, 4MB work_mem). Значения умеренные, чтобы при connection_limit
    # пула (20) суммарный work_mem не выбил контейнер в OOM:
    #   shared_buffers       — кэш страниц БД (~20% потолка).
    #   effective_cache_size — подсказка планировщику, сколько всего под кэш (ОС+БД).
    #   work_mem             — на сортировку/хэш одного узла плана; ×соединения×узлы.
    #   maintenance_work_mem — VACUUM / CREATE INDEX.
    #   random_page_cost/io  — SSD: случайное чтение почти как последовательное →
    #                          планировщик охотнее берёт индексы.
    command:
      - postgres
      # Учёт запросов: без него нечем ответить на вопрос «что именно тормозит»
      # — остаётся гадать по коду. Стоит около процента CPU и окупается первым
      # же разбором. Смотреть так:
      #   SELECT calls, round(mean_exec_time::numeric,1) ms, round(total_exec_time::numeric) total,
      #          left(query, 120) FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;
      # Обнулить перед замером: SELECT pg_stat_statements_reset();
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_workers=4
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=20MB
      - -c
      - maintenance_work_mem=384MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    environment:
      POSTGRES_USER: tradestats
      # Без значения по умолчанию намеренно. Раньше стояло
      # ${POSTGRES_PASSWORD:-tradestats}: забыл переменную — база молча
      # поднималась с паролем "tradestats". Наружу порт не публикуется, но
      # любой контейнер в compose-сети получал бы полный доступ по угадываемому
      # паролю. Теперь отсутствие переменной ломает старт явным сообщением.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен — задайте его в .env}
      POSTGRES_DB: tradestats
    volumes:
      - tradestats_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradestats -d tradestats"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tradestats

  app:
    image: ghcr.io/siarheyb/statstrade-app:latest
    container_name: tradestats-app
    restart: unless-stopped
    # Главный «виновник» прошлого OOM (next-server раздувался до ~6.6 ГБ на тяжёлом
    # orderflow). Импорт отчётов (парсинг HTML + тысячи сделок) требует
    # дополнительной памяти; без запаса контейнер убивается OOM и nginx отдаёт
    # offline.html — «Сервер временно недоступен».
    #
    # Лимит здесь влияет не только на потолок: Node берёт размер JS-кучи ИМЕННО
    # из лимита контейнера (замерено: 3072m → heap 1728 МБ, 3584m → 1984 МБ),
    # а os.totalmem() при этом врёт и показывает всю память хоста. То есть
    # поднятый mem_limit — это напрямую больше кучи под тяжёлые страницы, а не
    # просто «пусть будет».
    mem_limit: 3584m
    mem_reservation: 512m
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Внутри compose-сети БД доступна по имени сервиса `db`.
      # connection_limit/pool_timeout — больше пула Prisma и дольше ожидание
      # соединения: карта ордеров шлёт по несколько тяжёлых SQL-агрегаций за
      # запрос, дефолтных 9 соединений не хватало (Timed out fetching a connection).
      DATABASE_URL: postgresql://tradestats:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен — задайте его в .env}@db:5432/tradestats?schema=public&connection_limit=20&pool_timeout=20
      # Авто-синхронизацию бирж «по времени» на сервере гоняет СИСТЕМНЫй крон
      # хоста (см. SELF_HOSTING.md — шаг про /api/cron/sync), поэтому встроенный
      # in-process планировщик выключен: иначе синхронизации дублировались бы.
      ENABLE_SCHEDULER: "false"
      # Внутри compose-сети collector доступен по имени сервиса. Переопределить
      # можно в .env. COLLECTOR_METRICS_TOKEN/ADMIN_EMAILS задаются в .env.
      COLLECTOR_URL: ${COLLECTOR_URL:-http://collector:8080}
      # То же самое для forex-collector (раздел «Форекс» в админке).
      FX_COLLECTOR_URL: ${FX_COLLECTOR_URL:-http://forex-collector:8081}
      # Логи импорта в БД (ImportLog). Без «true» LogService.record() молча
      # возвращается — логи не пишутся, диагностика импорта слепая.
      ENABLE_IMPORT_LOGS: ${ENABLE_IMPORT_LOGS:-true}
    # Порт наружу НЕ публикуем: вход через edge (nginx ниже). Так во время
    # рестартов app (деплой watchtower, OOM) туннель получает красивую страницу
    # «технический перерыв», а не голый 502.
    expose:
      - "3000"
    volumes:
      # Файлы бэкапов лежат на хосте, а не внутри контейнера: watchtower
      # пересоздаёт app на каждом деплое, и всё, что осталось внутри, пропадает
      # вместе с ним — экспорт «в никуда». Плюс так дамп можно забрать с
      # сервера обычным scp.
      - ./backup/tmp:/app/backup/tmp
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Встроенный DNS Docker (127.0.0.11) проксирует запросы на апстримы,
    # которые он захватил из хоста при старте демона/сети (см. `ExtServers` в
    # /etc/resolv.conf контейнера) — 2026-09 они перестали отвечать
    # (ESERVFAIL/EAI_AGAIN на oauth2.googleapis.com), хотя те же домены
    # штатно резолвились с самого хоста и напрямую через 1.1.1.1 внутри
    # контейнера. Публичные резолверы в обход застрявшего проксирования.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - tradestats

  # Входная прослойка: туннель (Tailscale Funnel / cloudflared) указывает на
  # 127.0.0.1:3000 как и раньше — только теперь это nginx, а не app. Когда app
  # недоступен, nginx отдаёт deploy/nginx/offline.html с автообновлением.
  # Конфиг и страница монтируются из репозитория: правка = git pull + up -d.
  edge:
    image: nginx:1.27-alpine
    container_name: tradestats-edge
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/offline.html:/usr/share/nginx/html/offline.html:ro
    ports:
      # Слушаем только localhost — наружу выставляет туннель (Tailscale/Cloudflare).
      - "127.0.0.1:3000:80"
    networks:
      - tradestats

  collector:
    image: ghcr.io/siarheyb/statstrade-collector:latest
    container_name: tradestats-collector
    restart: unless-stopped
    # Лёгкий long-running процесс (стаканы + минутный rollup-накопитель в памяти).
    # Реальное потребление ~0.1–0.2 ГБ (замерено) — тройного запаса хватает и
    # на бэкафилл каскада, где в памяти собираются часовые и дневные агрегаты.
    mem_limit: 512m
    mem_reservation: 128m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tradestats:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен — задайте его в .env}@db:5432/tradestats?schema=public
      SYMBOLS: ${OB_SYMBOLS:-BTCUSDT,ETHUSDT}
      EXCHANGES: ${OB_EXCHANGES:-binance-futures,binance-spot}
      SNAPSHOT_MS: ${OB_SNAPSHOT_MS:-2000}
      DEPTH_PCT: ${OB_DEPTH_PCT:-0.02}
      NOISE_MIN_NOTIONAL: ${OB_NOISE_MIN_NOTIONAL:-50000}
      BIG_NOTIONAL: ${OB_BIG_NOTIONAL:-100000}
      # Сырые снапшоты. Их не читает ни один живой запрос — карта, B/A и профиль
      # стакана берут данные из rollup и ObLatestBook, а ObSnapshot остаётся
      # только путём отката и материалом для диагностики. При этом он самый
      # тяжёлый в базе (~3 ГБ в сутки), поэтому держим 3 дня.
      RETENTION_DAYS: ${OB_RETENTION_DAYS:-3}
      # Минутный слой rollup: нужен окнам шириной в несколько дней, всё, что
      # шире, читается из часового и дневного уровней каскада. Часовой и дневной
      # хранятся вечно — история лимиток не теряется, на глубине лет она просто
      # менее подробная. 0 = не чистить и минутный слой.
      ROLLUP_MINUTE_RETENTION_DAYS: ${OB_ROLLUP_MINUTE_RETENTION_DAYS:-30}
      TRADE_RETENTION_DAYS: ${OB_TRADE_RETENTION_DAYS:-30}
      CANDLE_RETENTION_DAYS: ${OB_CANDLE_RETENTION_DAYS:-365}
      # Фича "Рекомендации" (дневные уровни/сетапы пробой-ложный пробой по
      # всем USDT-M фьючерсам Binance) — см. TRADE_RECOMMENDATIONS_PLAN.md.
      SCAN_ALL_USDT_PAIRS: ${OB_SCAN_ALL_USDT_PAIRS:-false}
      PORT: 8080
      # Bearer-токен для защищённого GET /metrics — его опрашивает админ-панель
      # приложения (раздел «Карта ордеров»). Должен совпадать с COLLECTOR_METRICS_TOKEN
      # у сервиса app. Если пусто — /metrics закрыт (404), раздел работает на
      # агрегатах Postgres без live-статуса фидов.
      COLLECTOR_METRICS_TOKEN: ${COLLECTOR_METRICS_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # См. комментарий у dns: в сервисе app — тот же битый апстрим встроенного
    # DNS Docker бил и по бирже (fetch к Binance).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - tradestats

  # Forex collector — Finnhub WebSocket (тики → свечи, реальное время, без
  # лимита на сообщения) как основной источник + Twelve Data REST для
  # бэкафилла истории и редкого fallback-догона. Оба доступны из РБ.
  # Без данных стакана (depth) — B/A, дельта, дисбаланс считаются proxy из свечей.
  forex-collector:
    image: ghcr.io/siarheyb/statstrade-forex-collector:latest
    container_name: tradestats-forex-collector
    restart: unless-stopped
    # Самый скромный из сервисов: HTTP-опрос + запись в Postgres, замерено ~32 МБ.
    # Потолок поднят не под текущую нагрузку, а под бэкафилл: при добавлении
    # новой пары он тянет 20 000 минуток разом.
    mem_limit: 320m
    mem_reservation: 64m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tradestats:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен — задайте его в .env}@db:5432/tradestats?schema=public
      FX_SYMBOLS: ${FX_SYMBOLS:-EUR/USD,GBP/USD,USD/JPY,USD/CHF,AUD/USD,NZD/USD,EUR/JPY,GBP/JPY,XAU/USD}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY}
      # Dukascopy — ОСНОВНОЙ источник по всем парам (ключ не нужен). Finnhub
      # ниже поднимается автоматически, только если Dukascopy замолчит; список
      # ниже — инструменты, которых у резерва нет и подхватить он их не сможет.
      FX_DUKASCOPY_SYMBOLS: ${FX_DUKASCOPY_SYMBOLS:-XAU/USD,XAG/USD}
      FX_DUKASCOPY_POLL_SEC: ${FX_DUKASCOPY_POLL_SEC:-15}
      FX_DUKASCOPY_FAIL_CYCLES: ${FX_DUKASCOPY_FAIL_CYCLES:-4}
      # Опрос тиков: из них собирается текущая (ещё не закрытая) минутка —
      # 1MIN-бары Dukascopy отдаёт только закрытыми. 5 с × 9 инструментов =
      # 1.8 запроса/с, вместе со свечами ~2.8/с (замер: 3/с эндпоинт держит
      # без единой ошибки). Увеличивать шаг = экономить запросы ценой
      # «живости» минутного графика.
      FX_TICK_POLL_SEC: ${FX_TICK_POLL_SEC:-5}
      FX_TICK_LIMIT: ${FX_TICK_LIMIT:-500}
      # Twelve Data выключен: историю приносит Dukascopy, а free-лимит и так
      # был в перерасходе. Включать только осознанно.
      FX_TWELVEDATA_ENABLED: ${FX_TWELVEDATA_ENABLED:-0}
      FX_FALLBACK_INTERVAL_SEC: ${FX_FALLBACK_INTERVAL_SEC:-900}
      FX_FLUSH_INTERVAL_SEC: ${FX_FLUSH_INTERVAL_SEC:-15}
      FX_CANDLE_RETENTION_DAYS: ${FX_CANDLE_RETENTION_DAYS:-365}
      # 1m растёт в 5 раз быстрее 5m — храним заметно короче (см. pruneOld).
      FX_M1_RETENTION_DAYS: ${FX_M1_RETENTION_DAYS:-30}
      PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # См. комментарий у dns: в сервисе app — тот же битый апстрим ронял и
    # Dukascopy (ECONNRESET на середине TLS, не сразу на резолве).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - tradestats

  # Авто-деплой: следит за GHCR и подменяет образы app/collector на новые
  watchtower:
    image: containrrr/watchtower
    container_name: tradestats-watchtower
    restart: unless-stopped
    # Дёргает GHCR раз в 120с и ничего не держит в памяти — 256m ему было
    # выделено «на глаз»; освободившееся отдано БД и приложению.
    mem_limit: 128m
    mem_reservation: 32m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Креды для приватного GHCR (создаются `docker login ghcr.io`).
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "120"
      DOCKER_API_VERSION: "1.40"
    command: ["--label-enable", "--cleanup", "--interval", "120", "--stop-timeout", "30s"]
    # См. комментарий у dns: в сервисе app — без него watchtower тоже не
    # достучится до ghcr.io и авто-деплой молча встанет.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - tradestats

volumes:
  tradestats_pg:
