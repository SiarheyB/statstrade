# Входная прослойка перед app-контейнером. Смысл: когда приложение
# перезапускается (деплой watchtower, OOM-рестарт, миграции при старте),
# пользователи видят красивую страницу «технический перерыв» с автообновлением,
# а не голый 502 от туннеля. Funnel/туннель указывает на этот nginx.
#
# NB: при полном отключении сервера (света) эту страницу отдавать некому —
# для этого случая нужен внешний слой (Cloudflare), см. docs/SELF_HOSTING.md.

server {
    listen 80;

    # Имя app резолвим в момент запроса через DNS Docker'а (127.0.0.11), а не на
    # старте nginx: иначе nginx вообще не поднимется, пока app-контейнер лежит —
    # а нам нужно ровно наоборот (edge живёт, пока app перезапускается).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Технические страницы nginx — без доступа снаружи напрямую.
    location = /offline.html {
        root /usr/share/nginx/html;
        internal;
        add_header Cache-Control "no-store";
    }

    # Импорт отчётов — долгая операция (парсинг + запись тысяч сделок).
    # Увеличиваем таймаут до 5 минут, чтобы не получить 502/offline.html
    # при обработке большого файла.
    # Дефолтный client_max_body_size в nginx — 1 МБ, отчёты MT4/5 бывают
    # больше. Лимит должен быть не меньше MAX_BYTES в import/route.ts (10 МБ).
    location /api/accounts {
        client_max_body_size 20m;

        set $upstream http://app:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ЗАМЕНА, а не $proxy_add_x_forwarded_for: тот ДОПИСЫВАЕТ к тому,
        # что прислал клиент, и первым в цепочке остаётся его собственное
        # значение. Приложение ключует по IP все лимиты (вход, регистрация,
        # 2FA) и идентификатор посетителя в статистике — подделываемый
        # заголовок снимал их все. См. clientIpFromHeaders в lib/ratelimit.ts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Cloudflare перед нами не стоит (наружу смотрит Tailscale Funnel),
        # поэтому такой заголовок мог прийти только от клиента — затираем.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Импорт может быть долгим — 5 минут
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;

        # Ошибки САМОГО приложения (его 5xx-JSON) проходят как есть;
        # error_page срабатывает только на gateway-ошибки nginx —
        # когда app-контейнер недоступен/не отвечает.
        proxy_intercept_errors off;
        error_page 502 503 504 /offline.html;
    }

    # Бэкапы базы из админки: загрузка дампа на сервер и скачивание его
    # обратно на машину администратора.
    #
    # В общий `location /` это класть нельзя: там действует дефолтный
    # client_max_body_size в 1 МБ, а дамп базы — десятки и сотни мегабайт.
    # Импорт упирался бы в 413 от nginx, даже не доходя до приложения (там
    # свой предел — 200 МБ, см. api/admin/backup/upload/route.ts).
    location /api/admin/backup {
        client_max_body_size 256m;
        # Тело запроса гоним сразу в приложение, а не копим во временный файл
        # nginx: на сотнях мегабайт это лишняя запись на диск сервера.
        proxy_request_buffering off;
        # То же для ответа: дамп отдаётся потоком, буферизовать его незачем.
        proxy_buffering off;

        set $upstream http://app:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ЗАМЕНА, а не $proxy_add_x_forwarded_for: тот ДОПИСЫВАЕТ к тому,
        # что прислал клиент, и первым в цепочке остаётся его собственное
        # значение. Приложение ключует по IP все лимиты (вход, регистрация,
        # 2FA) и идентификатор посетителя в статистике — подделываемый
        # заголовок снимал их все. См. clientIpFromHeaders в lib/ratelimit.ts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Cloudflare перед нами не стоит (наружу смотрит Tailscale Funnel),
        # поэтому такой заголовок мог прийти только от клиента — затираем.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;

        # Дамп большой базы качается не за секунду.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;

        proxy_intercept_errors off;
        error_page 502 503 504 /offline.html;
    }

    # UI-запросы дашборда / аналитики / списка сделок. Тяжёлая агрегация
    # статистики (milestone: /api/stats) может быть долгой для больших портфелей
    # с тысячами форекс-сделок — даём те же 5 минут, что и импорту.
    location /api/stats {
        set $upstream http://app:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ЗАМЕНА, а не $proxy_add_x_forwarded_for: тот ДОПИСЫВАЕТ к тому,
        # что прислал клиент, и первым в цепочке остаётся его собственное
        # значение. Приложение ключует по IP все лимиты (вход, регистрация,
        # 2FA) и идентификатор посетителя в статистике — подделываемый
        # заголовок снимал их все. См. clientIpFromHeaders в lib/ratelimit.ts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Cloudflare перед нами не стоит (наружу смотрит Tailscale Funnel),
        # поэтому такой заголовок мог прийти только от клиента — затираем.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Статистика может быть долгой для больших портфелей — 5 минут
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;

        proxy_intercept_errors off;
        error_page 502 503 504 /offline.html;
    }

    location / {
        set $upstream http://app:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ЗАМЕНА, а не $proxy_add_x_forwarded_for: тот ДОПИСЫВАЕТ к тому,
        # что прислал клиент, и первым в цепочке остаётся его собственное
        # значение. Приложение ключует по IP все лимиты (вход, регистрация,
        # 2FA) и идентификатор посетителя в статистике — подделываемый
        # заголовок снимал их все. См. clientIpFromHeaders в lib/ratelimit.ts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Cloudflare перед нами не стоит (наружу смотрит Tailscale Funnel),
        # поэтому такой заголовок мог прийти только от клиента — затираем.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Долгие ответы приложения (синк, тяжёлые агрегации) не обрубаем.
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;

        # Ошибки САМОГО приложения (его 5xx-JSON) проходят как есть;
        # error_page срабатывает только на gateway-ошибки nginx —
        # когда app-контейнер недоступен/не отвечает.
        proxy_intercept_errors off;
        error_page 502 503 504 /offline.html;
    }
}
